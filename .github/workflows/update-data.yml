name: 장학금 정보 자동 갱신

on:
  schedule:
    - cron: '0 17 * * 1'  # 매주 월요일 새벽 2시 KST (UTC 17시, 한국장학재단 월간 갱신 대비)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 학자금지원정보 재수집 (매달 새 버전으로 등록됨)
        run: python scripts/fetch_scholarship_data.py
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: 페이지용 데이터 재생성
        run: python scripts/process_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _rawdata/ search_index.json
          git diff --cached --quiet || git commit -m "chore: 장학금 정보 자동 갱신 $(date +'%Y-%m-%d')"
          git push
